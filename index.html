<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .image-section {
            width: 66.67%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .image-section img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .text-section {
            width: 33.33%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #764ba2 0%, #f093fb 100%);
        }

        h1 {
            font-size: 4rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="image-section">
        <img src="苹果老师电脑.png" alt="苹果老师电脑" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'placeholder\'>请将图片文件 \"苹果老师电脑.png\" 放入项目目录</div>'">
    </div>
    <div class="text-section">
        <h1>Hello</h1>
    </div>
</body>
</html>
