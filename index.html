<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: white;
        }

        .image-section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 20px;
            position: relative;
        }

        .image-section img {
            width: 95%;
            height: 95%;
            object-fit: contain;
        }

        .screen-overlay {
            position: absolute;
            width: 68%;
            height: 30%;
            background: #000;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(-70%);
            overflow: hidden;
            border-radius: 2px;
        }

        .screen-surface {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(135deg,
                rgba(255,255,255,0.03) 0%,
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            z-index: 3;
        }

        #staticCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            z-index: 1;
        }

        .text-content {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            padding: 15px;
            color: #00ff00;
            font-size: 14px;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            z-index: 2;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        .text-section {
            display: none;
        }

        .placeholder {
            color: #999;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="image-section">
        <img src="老式苹果电脑.png" alt="老式苹果电脑" id="computerImage" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'placeholder\'>请将图片文件 \"老式苹果电脑.png\" 放入项目目录</div>'">

        <div class="screen-overlay">
            <canvas id="staticCanvas"></canvas>
            <div class="text-content" id="textContent"></div>
            <div class="screen-surface"></div>
        </div>
    </div>
    <div class="text-section">
        <h1>Hello</h1>
    </div>

    <script>
        // 雪花屏效果
        const canvas = document.getElementById('staticCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 255;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function showStatic() {
            canvas.style.opacity = '0.5';
            const interval = setInterval(drawStatic, 50);

            setTimeout(() => {
                clearInterval(interval);
                canvas.style.opacity = '0';
            }, 500);
        }

        // 每12秒显示2次雪花屏
        setInterval(() => {
            showStatic();
            setTimeout(showStatic, 6000);
        }, 12000);

        // 打字机效果
        const text = "Mr. Victor Li's art gallery was the culmination of his life's work. Yet last night, after the doors were closed to the public, the esteemed curator vanished without a trace, as if swallowed by the very masterpieces he housed.";
        const textElement = document.getElementById('textContent');
        let index = 0;
        let typingSpeed = 30;

        function typeWriter() {
            if (index < text.length) {
                textElement.textContent += text.charAt(index);
                index++;

                // 最后10个字符减速
                if (index > text.length - 10) {
                    typingSpeed = 150;
                }

                setTimeout(typeWriter, typingSpeed);
            } else {
                // 打字结束后显示光标
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                textElement.appendChild(cursor);
            }
        }

        // 延迟1秒后开始打字
        setTimeout(typeWriter, 1000);
    </script>
</body>
</html>
