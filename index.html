<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: white;
        }

        .image-section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 20px;
            position: relative;
        }

        .image-section img {
            width: 95%;
            height: 95%;
            object-fit: contain;
        }

        .screen-overlay {
            position: absolute;
            width: 25.44%;
            height: 33.81%;
            background: #000;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateX(-3.1%) translateY(-67%);
            overflow: hidden;
            border-radius: 2px;
        }

        .screen-surface {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(135deg,
                rgba(255,255,255,0.03) 0%,
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            z-index: 3;
        }

        #staticCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            z-index: 1;
        }

        .text-content {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            padding: 15px;
            color: #00ff00;
            font-size: 14px;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            z-index: 2;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        .text-section {
            display: none;
        }

        .sticky-note {
            position: absolute;
            width: 80px;
            height: 80px;
            padding: 10px;
            font-size: 10px;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            font-family: 'Comic Sans MS', cursive;
            z-index: 10;
        }

        .note-yellow {
            background: #feff9c;
        }

        .note-pink {
            background: #ff7eb9;
        }

        .note-blue {
            background: #7afcff;
        }

        .note-green {
            background: #a7f070;
        }

        .note-orange {
            background: #ffa500;
        }

        .note-purple {
            background: #dda0dd;
        }

        .placeholder {
            color: #999;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="image-section">
        <img src="老式苹果电脑.png" alt="老式苹果电脑" id="computerImage" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'placeholder\'>请将图片文件 \"老式苹果电脑.png\" 放入项目目录</div>'">

        <div class="screen-overlay">
            <canvas id="staticCanvas"></canvas>
            <div class="text-content" id="textContent"></div>
            <div class="screen-surface"></div>
        </div>

        <!-- Sticky notes around the screen -->
        <div class="sticky-note note-yellow" style="top: 28%; left: 42%; transform: rotate(-5deg);"></div>
        <div class="sticky-note note-pink" style="top: 30%; left: 50%; transform: rotate(8deg);">
            <img src="形状.pdf" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none';">
        </div>
        <div class="sticky-note note-blue" style="top: 35%; left: 38%; transform: rotate(-3deg);"></div>
        <div class="sticky-note note-green" style="top: 32%; left: 54%; transform: rotate(5deg);"></div>
        <div class="sticky-note note-orange" style="top: 40%; left: 44%; transform: rotate(-8deg);"></div>
        <div class="sticky-note note-purple" style="top: 26%; left: 48%; transform: rotate(3deg);"></div>
    </div>

    <script>
        // 雪花屏效果
        const canvas = document.getElementById('staticCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 255;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function showStatic() {
            canvas.style.opacity = '0.5';
            const interval = setInterval(drawStatic, 50);

            setTimeout(() => {
                clearInterval(interval);
                canvas.style.opacity = '0';
            }, 500);
        }

        // 每12秒显示2次雪花屏
        setInterval(() => {
            showStatic();
            setTimeout(showStatic, 6000);
        }, 12000);

        // 打字机效果
        const text = "Mr. Victor Li's art gallery was the culmination of his life's work. Yet last night, after the doors were closed to the public, the esteemed curator vanished without a trace, as if swallowed by the very masterpieces he housed.";
        const textElement = document.getElementById('textContent');
        let index = 0;
        let typingSpeed = 30;

        function typeWriter() {
            if (index < text.length) {
                textElement.textContent += text.charAt(index);
                index++;

                // 最后10个字符减速
                if (index > text.length - 10) {
                    typingSpeed = 150;
                }

                setTimeout(typeWriter, typingSpeed);
            } else {
                // 打字结束后显示光标
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                textElement.appendChild(cursor);
            }
        }

        // 延迟1秒后开始打字
        setTimeout(typeWriter, 1000);

        // 便签拖动功能
        const stickyNotes = document.querySelectorAll('.sticky-note');

        stickyNotes.forEach(note => {
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            note.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;

                if (e.target === note) {
                    isDragging = true;
                    note.style.cursor = 'grabbing';
                    note.style.zIndex = '1000';
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();

                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;

                    xOffset = currentX;
                    yOffset = currentY;

                    setTranslate(currentX, currentY, note);
                }
            }

            function dragEnd(e) {
                if (isDragging) {
                    initialX = currentX;
                    initialY = currentY;
                    isDragging = false;
                    note.style.cursor = 'grab';
                    note.style.zIndex = '10';
                }
            }

            function setTranslate(xPos, yPos, el) {
                const computedStyle = window.getComputedStyle(el);
                const transform = computedStyle.transform;

                // 保留原有的rotate变换
                let rotation = '';
                if (transform !== 'none') {
                    const values = transform.split('(')[1].split(')')[0].split(',');
                    const angle = Math.round(Math.atan2(values[1], values[0]) * (180/Math.PI));
                    rotation = ` rotate(${angle}deg)`;
                }

                el.style.transform = `translate(${xPos}px, ${yPos}px)${rotation}`;
            }

            // 设置初始cursor样式
            note.style.cursor = 'grab';
        });
    </script>
</body>
</html>
