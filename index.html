<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: white;
        }

        .image-section {
            width: 66.67%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 20px;
        }

        .image-section img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 10px;
        }

        .text-section {
            width: 33.33%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        h1 {
            font-size: 4rem;
            color: #333;
            text-shadow: none;
        }

        .placeholder {
            color: #999;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="image-section">
        <img src="老式苹果电脑.png" alt="老式苹果电脑" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'placeholder\'>请将图片文件 \"老式苹果电脑.png\" 放入项目目录</div>'">
    </div>
    <div class="text-section">
        <h1>Hello</h1>
    </div>
</body>
</html>
