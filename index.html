<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: white;
            cursor: none;
        }

        .image-section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 20px;
            position: relative;
        }

        .image-section img {
            width: 95%;
            height: 95%;
            object-fit: contain;
        }

        .desktop-background {
            position: absolute;
            width: 100%;
            top: 23%;
            left: 0;
            z-index: 1;
        }

        .desktop-background img {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-section > img {
            position: relative;
            z-index: 2;
        }

        .tissue-box {
            position: absolute;
            top: 76%;
            right: 15%;
            transform: translateY(-50%);
            width: 200px;
            height: auto;
            z-index: 3;
            cursor: pointer;
        }

        .tissue-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .tissue-hand {
            position: absolute;
            height: 200px;
            width: auto;
            z-index: 1.5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            transform: translate(-50%, -50%);
        }

        .tissue-hand img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .screen-overlay {
            position: absolute;
            width: 25.44%;
            height: 33.81%;
            background: #000;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateX(-3.1%) translateY(-67%);
            overflow: hidden;
            border-radius: 2px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><rect x="0" y="0" width="2" height="2" fill="white"/><rect x="0" y="2" width="2" height="2" fill="white"/><rect x="2" y="2" width="2" height="2" fill="black"/><rect x="0" y="4" width="2" height="2" fill="white"/><rect x="2" y="4" width="2" height="2" fill="white"/><rect x="4" y="4" width="2" height="2" fill="black"/><rect x="0" y="6" width="2" height="2" fill="white"/><rect x="2" y="6" width="2" height="2" fill="white"/><rect x="4" y="6" width="2" height="2" fill="white"/><rect x="6" y="6" width="2" height="2" fill="black"/><rect x="0" y="8" width="2" height="2" fill="white"/><rect x="2" y="8" width="2" height="2" fill="white"/><rect x="4" y="8" width="2" height="2" fill="white"/><rect x="6" y="8" width="2" height="2" fill="white"/><rect x="8" y="8" width="2" height="2" fill="black"/><rect x="0" y="10" width="2" height="2" fill="white"/><rect x="2" y="10" width="2" height="2" fill="white"/><rect x="4" y="10" width="2" height="2" fill="white"/><rect x="6" y="10" width="2" height="2" fill="black"/><rect x="8" y="10" width="2" height="2" fill="black"/><rect x="0" y="12" width="2" height="2" fill="white"/><rect x="2" y="12" width="2" height="2" fill="white"/><rect x="4" y="12" width="2" height="2" fill="black"/><rect x="2" y="14" width="2" height="2" fill="black"/></svg>') 0 0, auto;
            z-index: 5;
        }

        .screen-surface {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(135deg,
                rgba(255,255,255,0.03) 0%,
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            z-index: 3;
        }

        #staticCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            z-index: 1;
        }

        .text-content {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            padding: 15px;
            color: #00ff00;
            font-size: 14px;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            z-index: 2;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .welcome-text {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .password-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .password-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .password-inputs {
            display: flex;
            gap: 10px;
        }

        .password-box {
            width: 40px;
            height: 50px;
            background: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 28px;
            text-align: center;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .question-container {
            display: none;
            font-size: 18px;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .question-text {
            text-align: left;
            font-size: 16px;
        }

        .answer-input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .answer-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #00ff00;
            color: #00ff00;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            outline: none;
            text-align: center;
            width: 200px;
            padding: 5px;
        }

        .loading-container {
            display: none;
            font-size: 24px;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-spinner {
            font-size: 24px;
        }

        .progress-bar-container {
            width: 80%;
            height: 20px;
            background: #003300;
            border: 2px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #00ff00;
            width: 0%;
            transition: width 1s ease;
        }

        .progress-text {
            font-size: 16px;
            color: #00ff00;
        }

        .final-image-container {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }

        .final-image-container img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .text-content.shake {
            animation: shake 0.5s;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .flash {
            animation: flash 0.3s 2;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        .text-section {
            display: none;
        }

        .sticky-note {
            position: absolute;
            width: 80px;
            height: 80px;
            padding: 10px;
            font-size: 10px;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            font-family: 'Comic Sans MS', cursive;
            z-index: 10;
        }

        .note-yellow {
            background: #feff9c;
        }

        .note-pink {
            background: #ff7eb9;
        }

        .note-blue {
            background: #7afcff;
        }

        .note-green {
            background: #a7f070;
        }

        .note-orange {
            background: #ffa500;
        }

        .note-purple {
            background: #dda0dd;
        }

        .placeholder {
            color: #999;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        .custom-cursor {
            position: fixed;
            width: 700px;
            height: 700px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -10%);
        }

        .custom-cursor img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 35%, rgba(0,0,0,0) 55%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 35%, rgba(0,0,0,0) 55%, rgba(0,0,0,0) 100%);
        }
    </style>
</head>
<body>
    <div class="custom-cursor" id="customCursor">
        <img src="手.png" alt="手形光标" onerror="this.parentElement.style.display='none';">
    </div>
    <div class="image-section">
        <div class="desktop-background">
            <img src="桌面.png" alt="桌面背景" onerror="this.style.display='none';">
        </div>
        <div class="tissue-box">
            <img src="抽纸.png" alt="抽纸" onerror="this.style.display='none';">
        </div>
        <div class="tissue-hand" id="tissueHand">
            <img src="抽纸的手.png" alt="抽纸的手" onerror="this.style.display='none';">
        </div>
        <img src="老式苹果电脑.png" alt="老式苹果电脑" id="computerImage" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'placeholder\'>请将图片文件 \"老式苹果电脑.png\" 放入项目目录</div>'">

        <div class="screen-overlay" id="screenOverlay">
            <canvas id="staticCanvas"></canvas>
            <div class="text-content" id="textContent">
                <div class="welcome-text" id="welcomeText">WELCOME</div>
                <div class="password-container" id="passwordContainer">
                    <div class="password-title">Password</div>
                    <div class="password-inputs">
                        <input type="text" class="password-box" maxlength="1" id="digit1">
                        <input type="text" class="password-box" maxlength="1" id="digit2">
                        <input type="text" class="password-box" maxlength="1" id="digit3">
                        <input type="text" class="password-box" maxlength="1" id="digit4">
                    </div>
                </div>
                <div class="loading-container" id="loadingContainer">
                    <div class="loading-spinner" id="loadingSpinner">|</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div class="question-container" id="questionContainer">
                    <div class="question-text">what is my favorite animal</div>
                    <div class="answer-input-container">
                        <input type="text" class="answer-input" id="answerInput" placeholder="">
                    </div>
                </div>
                <div class="final-image-container" id="finalImageContainer">
                    <img src="hello.png" alt="Hello" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'color: #00ff00;\'>Image not found</div>'">
                </div>
            </div>
            <div class="screen-surface"></div>
        </div>

        <!-- Sticky notes around the screen -->
        <div class="sticky-note note-yellow" style="top: 28%; left: 42%; transform: rotate(-5deg);">
            <img src="download.png" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none';">
        </div>
        <div class="sticky-note note-pink" style="top: 30%; left: 50%; transform: rotate(8deg);">
            <img src="形状.pdf" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none';">
        </div>
        <div class="sticky-note note-blue" style="top: 35%; left: 38%; transform: rotate(-3deg);">
            <img src="cat.png" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none';">
        </div>
        <div class="sticky-note note-green" style="top: 32%; left: 54%; transform: rotate(5deg);"></div>
        <div class="sticky-note note-orange" style="top: 40%; left: 44%; transform: rotate(-8deg);"></div>
        <div class="sticky-note note-purple" style="top: 26%; left: 48%; transform: rotate(3deg);"></div>
    </div>

    <script>
        // 自定义光标跟随鼠标
        const customCursor = document.getElementById('customCursor');
        const customCursorImg = customCursor.querySelector('img');

        document.addEventListener('mousemove', function(e) {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });

        // 鼠标进入/离开页面时的处理
        document.addEventListener('mouseenter', function() {
            customCursor.style.opacity = '1';
        });

        document.addEventListener('mouseleave', function() {
            customCursor.style.opacity = '0';
        });

        // 点击时切换手的图像
        document.addEventListener('mousedown', function() {
            customCursorImg.src = '抽纸的手.png';
        });

        document.addEventListener('mouseup', function() {
            customCursorImg.src = '手.png';
        });

        // 雪花屏效果
        const canvas = document.getElementById('staticCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 255;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function showStatic() {
            canvas.style.opacity = '0.5';
            const interval = setInterval(drawStatic, 50);

            setTimeout(() => {
                clearInterval(interval);
                canvas.style.opacity = '0';
            }, 500);
        }

        // 每12秒显示2次雪花屏
        setInterval(() => {
            showStatic();
            setTimeout(showStatic, 6000);
        }, 12000);

        // 游戏状态管理
        const welcomeText = document.getElementById('welcomeText');
        const passwordContainer = document.getElementById('passwordContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const questionContainer = document.getElementById('questionContainer');
        const screenOverlay = document.getElementById('screenOverlay');
        const textContent = document.getElementById('textContent');
        const stickyNotes = document.querySelectorAll('.sticky-note');

        const correctPassword = '6643'; // 正确密码
        const correctAnswer = 'cat'; // 正确答案
        let allNotesRemoved = false;
        let currentProgress = 0; // 当前进度：0%, 50%, 100%

        // 检测便签是否离开屏幕区域
        function checkStickyNotesPosition() {
            const screenRect = screenOverlay.getBoundingClientRect();
            let allOutside = true;

            stickyNotes.forEach(note => {
                const noteRect = note.getBoundingClientRect();

                // 检查便签是否与屏幕区域重叠
                const isOverlapping = !(
                    noteRect.right < screenRect.left ||
                    noteRect.left > screenRect.right ||
                    noteRect.bottom < screenRect.top ||
                    noteRect.top > screenRect.bottom
                );

                if (isOverlapping) {
                    allOutside = false;
                }
            });

            if (allOutside && !allNotesRemoved) {
                allNotesRemoved = true;
                setTimeout(() => {
                    showPasswordScreen();
                }, 2500);
            }
        }

        // 显示密码输入界面
        function showPasswordScreen() {
            welcomeText.style.display = 'none';
            passwordContainer.style.display = 'flex';

            // 聚焦第一个输入框
            document.getElementById('digit1').focus();
        }

        // 密码输入逻辑
        const digit1 = document.getElementById('digit1');
        const digit2 = document.getElementById('digit2');
        const digit3 = document.getElementById('digit3');
        const digit4 = document.getElementById('digit4');
        const inputs = [digit1, digit2, digit3, digit4];

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // 只允许输入数字
                e.target.value = e.target.value.replace(/[^0-9]/g, '');

                if (e.target.value && index < 3) {
                    inputs[index + 1].focus();
                }

                // 检查是否输入完成
                if (index === 3 && e.target.value) {
                    checkPassword();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function checkPassword() {
            const enteredPassword = inputs.map(input => input.value).join('');

            if (enteredPassword === correctPassword) {
                // 密码正确
                screenOverlay.classList.add('flash');
                currentProgress = 50; // 完成第一个问题

                setTimeout(() => {
                    screenOverlay.classList.remove('flash');
                    showLoadingScreen(50);
                }, 600);
            } else {
                // 密码错误 - 清除并晃动
                textContent.classList.add('shake');
                inputs.forEach(input => input.value = '');
                digit1.focus();

                setTimeout(() => {
                    textContent.classList.remove('shake');
                }, 500);
            }
        }

        function showLoadingScreen(targetProgress) {
            passwordContainer.style.display = 'none';
            questionContainer.style.display = 'none';
            loadingContainer.style.display = 'flex';

            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            // 加载动画
            let loadingChars = ['|', '/', '-', '\\'];
            let charIndex = 0;
            const loadingInterval = setInterval(() => {
                loadingSpinner.textContent = loadingChars[charIndex];
                charIndex = (charIndex + 1) % loadingChars.length;
            }, 200);

            // 更新进度条
            setTimeout(() => {
                progressBar.style.width = targetProgress + '%';
                progressText.textContent = targetProgress + '%';
            }, 100);

            setTimeout(() => {
                clearInterval(loadingInterval);
                if (targetProgress === 50) {
                    showQuestionScreen();
                } else if (targetProgress === 100) {
                    showFinalImage();
                }
            }, 2000);
        }

        function showQuestionScreen() {
            loadingContainer.style.display = 'none';
            questionContainer.style.display = 'flex';

            // 聚焦答案输入框
            const answerInput = document.getElementById('answerInput');
            answerInput.focus();

            // 监听答案输入 - 自动检测
            answerInput.addEventListener('input', checkAnswer);
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answerInput');
            const enteredAnswer = answerInput.value.toLowerCase().trim();

            if (enteredAnswer === correctAnswer) {
                // 答案正确
                screenOverlay.classList.add('flash');
                currentProgress = 100; // 完成第二个问题

                // 移除输入监听器，防止重复触发
                answerInput.removeEventListener('input', checkAnswer);

                setTimeout(() => {
                    screenOverlay.classList.remove('flash');
                    answerInput.value = '';
                    showLoadingScreen(100);
                }, 600);
            }
        }

        function showFinalImage() {
            loadingContainer.style.display = 'none';
            document.getElementById('finalImageContainer').style.display = 'flex';
        }

        // 便签拖动功能
        stickyNotes.forEach(note => {
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            note.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;

                if (e.target === note) {
                    isDragging = true;
                    note.style.cursor = 'grabbing';
                    note.style.zIndex = '1000';
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();

                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;

                    xOffset = currentX;
                    yOffset = currentY;

                    setTranslate(currentX, currentY, note);
                }
            }

            function dragEnd(e) {
                if (isDragging) {
                    initialX = currentX;
                    initialY = currentY;
                    isDragging = false;
                    note.style.cursor = 'grab';
                    note.style.zIndex = '10';

                    // 检测便签位置
                    checkStickyNotesPosition();
                }
            }

            function setTranslate(xPos, yPos, el) {
                const computedStyle = window.getComputedStyle(el);
                const transform = computedStyle.transform;

                // 保留原有的rotate变换
                let rotation = '';
                if (transform !== 'none') {
                    const values = transform.split('(')[1].split(')')[0].split(',');
                    const angle = Math.round(Math.atan2(values[1], values[0]) * (180/Math.PI));
                    rotation = ` rotate(${angle}deg)`;
                }

                el.style.transform = `translate(${xPos}px, ${yPos}px)${rotation}`;
            }

            // 设置初始cursor样式
            note.style.cursor = 'grab';
        });

        // 抽纸盒点击功能
        const tissueBox = document.querySelector('.tissue-box');
        const tissueHand = document.getElementById('tissueHand');

        tissueBox.addEventListener('click', function(e) {
            // 获取点击位置
            const clickX = e.clientX;
            const clickY = e.clientY;

            // 定位手的图片（中间部分对准鼠标点击位置）
            tissueHand.style.left = clickX + 'px';
            tissueHand.style.top = clickY + 'px';
            tissueHand.style.opacity = '1';

            console.log('Hand showing - left:', tissueHand.style.left, 'top:', tissueHand.style.top, 'opacity:', tissueHand.style.opacity);

            // 500ms后手消失
            setTimeout(() => {
                tissueHand.style.opacity = '0';
                console.log('Hand hiding - opacity:', tissueHand.style.opacity);
            }, 500);
        });
    </script>
</body>
</html>
